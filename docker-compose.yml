services:
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    volumes:
      - /opt/goddess-os/data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - MINIO_ENDPOINT=minio
      - MINIO_PUBLIC_URL=https://goddessjessicasu.art/minio
    depends_on:
      - minio

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME}
        - NEXT_PUBLIC_TOKEN_NAME=${NEXT_PUBLIC_TOKEN_NAME}
        - NEXT_PUBLIC_PRIMARY_COLOR=${NEXT_PUBLIC_PRIMARY_COLOR}
        - NEXT_PUBLIC_ACCENT_COLOR=${NEXT_PUBLIC_ACCENT_COLOR}
        - NEXT_PUBLIC_SITE_TAGLINE=${NEXT_PUBLIC_SITE_TAGLINE}
        - NEXT_PUBLIC_API_URL=${API_URL}
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - /opt/goddess-os/data/minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
