services:
  backend:
    image: ghcr.io/goddessjessicasu/backend:latest
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    volumes:
      - /opt/goddess-os/data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db

  frontend:
    image: ghcr.io/goddessjessicasu/frontend:latest
    build:
      context: ./frontend
      target: production
      args:
        - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME}
        - NEXT_PUBLIC_TOKEN_NAME=${NEXT_PUBLIC_TOKEN_NAME}
        - NEXT_PUBLIC_PRIMARY_COLOR=${NEXT_PUBLIC_PRIMARY_COLOR}
        - NEXT_PUBLIC_ACCENT_COLOR=${NEXT_PUBLIC_ACCENT_COLOR}
        - NEXT_PUBLIC_SITE_TAGLINE=${NEXT_PUBLIC_SITE_TAGLINE}
        - NEXT_PUBLIC_API_URL=${API_URL}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
