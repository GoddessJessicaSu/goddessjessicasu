services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/data/dev.db

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
