services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - MINIO_ENDPOINT=minio
    depends_on:
      - minio

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
